services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crystal-games-backend
    restart: unless-stopped
    networks:
      - crystal-games

  caddy:
    build:
      context: .
      dockerfile: ./deployment/Dockerfile.caddy
    container_name: crystal-games-frontend
    ports:
      # Allows configuring the bind address/port via the CADDY_BIND_ADDRESS env var (e.g., CADDY_BIND_ADDRESS=127.0.0.1:8080).
      # Defaults to public port 80 if the env var is not specified.
      - "${CADDY_BIND_ADDRESS:-80}:80"
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - crystal-games

networks:
  crystal-games:
    name: crystal-games
    driver: bridge
